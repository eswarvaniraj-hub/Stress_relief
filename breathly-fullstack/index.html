<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Breathly — Modern Digital Well-Being & Adaptive Habit Platform</title>
  <meta name="description"
    content="Professional digital wellbeing and adaptive habit coach designed with calm aesthetics, early stress detection, and minimum-mode consistency." />
  <meta name="theme-color" content="#f7f8f6" />

  <!-- Google Identity Services SDK (Sign in with Google) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#1b4332',
              hover: '#143326',
              light: '#2d6a4f',
              tint: '#e8f3ed',
              border: '#cfe1d7',
              50: '#f0f6f3',
              100: '#e1ede7',
              200: '#c5dcce',
              300: '#9ec2ae',
              400: '#71a389',
              500: '#4e866b',
              600: '#3c6c55',
              700: '#2d5442',
              800: '#234436',
              900: '#1b382d',
              950: '#0e1f18'
            },
            canvas: '#f7f8f6',
            charcoal: {
              DEFAULT: '#18201d',
              muted: '#55645e',
              soft: '#82928b'
            },
            accent: {
              stress: '#c25e40',
              mood: '#2d6a4f',
              energy: '#b8772a',
              focus: '#2a6b74',
              streak: '#d94e34'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          },
          borderRadius: {
            'card': '18px',
            'card-lg': '22px'
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-in-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(5px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js for Stress Trend Visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti for Positive Feedback -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for In-Browser JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Cache Prevention Meta Tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Design Tokens -->
  <link rel="stylesheet" href="src/theme/tokens.css?v=2.0" />

  <!-- Custom Design System Styles -->
  <link rel="stylesheet" href="styles.css?v=5.0" />
</head>

<body class="bg-[#f7f8f6] text-[#18201d] min-h-screen antialiased selection:bg-[#e8f3ed] selection:text-[#1b4332]">
  <div id="root"></div>

  <!-- Backend API client (talks to the Express/PostgreSQL backend) -->
  <script src="api.js?v=5.0"></script>

  <!-- Consistency Engine & Grace Days Calculator -->
  <script src="consistency.js?v=5.0"></script>

  <!-- Reset Tension Telemetry & Effectiveness Analysis -->
  <script src="resetAnalysis.js?v=5.0"></script>

  <!-- Router & Navigation Stack -->
  <script src="src/router/router.js?v=2.0"></script>

  <!-- Error Boundary & Global Fallbacks -->
  <script src="src/components/common/ErrorBoundary.js?v=2.0"></script>

  <!-- Breathly Visual Design System Components -->
  <script src="src/components/ui/Button.js?v=2.0"></script>
  <script src="src/components/ui/Card.js?v=2.0"></script>
  <script src="src/components/ui/Modal.js?v=2.0"></script>
  <script src="src/components/ui/BottomSheet.js?v=2.0"></script>
  <script src="src/components/ui/TextInput.js?v=2.0"></script>
  <script src="src/components/ui/TextArea.js?v=2.0"></script>
  <script src="src/components/ui/Toast.js?v=2.0"></script>
  <script src="src/components/ui/Skeleton.js?v=2.0"></script>
  <script src="src/components/ui/EmptyState.js?v=2.0"></script>
  <script src="src/components/ui/ErrorState.js?v=2.0"></script>
  <script src="src/components/ui/ProgressBar.js?v=2.0"></script>

  <!-- Responsive Layout AppShell -->
  <script src="src/components/layout/AppShell.js?v=2.0"></script>

  <!-- Interventions -->
  <script src="src/components/interventions/InterventionSheet.js?v=2.0"></script>

  <!-- Pages -->
  <script src="src/pages/WelcomePage.js?v=2.0"></script>
  <script src="src/pages/OnboardingPage.js?v=2.0"></script>
  <script src="src/pages/InsightsPage.js?v=2.0"></script>
  <script src="src/pages/BreathingPlayerPage.js?v=2.0"></script>
  <script src="src/pages/BubbleRhythmPage.js?v=2.0"></script>
  <script src="src/pages/CompanionPage.js?v=2.0"></script>
  <script src="src/pages/JournalPage.js?v=2.0"></script>
  <script src="src/pages/ProfileSettingsPage.js?v=2.0"></script>
  <script src="src/pages/NotFoundPage.js?v=2.0"></script>

  <!-- Application Logic -->
  <script type="text/babel" src="app.js?v=5.0"></script>
</body>

</html>
